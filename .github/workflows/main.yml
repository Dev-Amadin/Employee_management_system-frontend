name: Build and deploy to Netlify

on:
  push:
    branches:
      - main

# this permissions were for gitHub pages
# permissions:
#   contents: read
#   pages: write
#   id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}
      
      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=dist
        env:
          NETLIFY_EMS_AUTH_TOKEN: ${{ secrets.NETLIFY_EMS_AUTH_TOKEN }}
          NETLIFY_EMS_SITE_ID: ${{ secrets.NETLIFY_EMS_SITE_ID }}    

      # - name: Setup GitHub Pages
